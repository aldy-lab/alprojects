    svg.dwg .fill  { fill: rgba(185, 196, 216, 0.10); stroke: none; }


    svg.dwg .anim-sweep{ transform-box: view-box; transform-origin: 500.0px 300.0px;
                  animation: sweep 12s linear infinite; }
