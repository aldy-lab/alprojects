<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="">
  <style>
    path, circle, rect, ellipse, polygon, polyline, line {
      fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .l  { stroke: rgba(185, 196, 216, 0.50); }
    .f  { stroke: rgba(185, 196, 216, 0.22); }
    .ff { stroke: rgba(185, 196, 216, 0.13); }
    .dash    { stroke-dasharray: 5 7; }
    .dashdot { stroke-dasharray: 14 5 2 5; }
    .fill  { fill: rgba(185, 196, 216, 0.10); stroke: none; }


    .anim-course { stroke-dasharray: 1; stroke-dashoffset: 1;
           animation: anim-course-draw 12s linear 0s infinite; }
    @keyframes anim-course-draw {
      0% { stroke-dashoffset: 1; }
      66.0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .c0 { animation-delay: 0.00s; }
    .c1 { animation-delay: 0.85s; }
    .c2 { animation-delay: 1.70s; }
    .c3 { animation-delay: 2.55s; }
    .c4 { animation-delay: 3.40s; }
    .c5 { animation-delay: 4.25s; }

    @media (prefers-reduced-motion: reduce) {
      [class*="anim"] { animation: none !important; }
    }
  </style>
