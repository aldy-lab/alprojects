  <style>
    path, circle, rect, ellipse, polygon, polyline, line {
      fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .l  { stroke: rgba(185, 196, 216, 0.50); }
    .f  { stroke: rgba(185, 196, 216, 0.22); }
    .ff { stroke: rgba(185, 196, 216, 0.13); }
    .dash    { stroke-dasharray: 5 7; }
    .dashdot { stroke-dasharray: 14 5 2 5; }
    .fill  { fill: rgba(185, 196, 216, 0.10); stroke: none; }


    .anim-bolt { opacity: 0; animation: bolt-in 8s linear infinite; }
    @keyframes bolt-in {
      0%, 3% { opacity: 0; }
      9%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
    .b0 { animation-delay: 0.00s; }
    .b1 { animation-delay: 0.60s; }
    .b2 { animation-delay: 1.20s; }
    .b3 { animation-delay: 1.80s; }
    .b4 { animation-delay: 2.40s; }
    .b5 { animation-delay: 3.00s; }
    .b6 { animation-delay: 3.60s; }
    .b7 { animation-delay: 4.20s; }

    @media (prefers-reduced-motion: reduce) {
      [class*="anim"] { animation: none !important; }
    }
  </style>
