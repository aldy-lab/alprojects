<svg xmlns="http://www.w3.org/2000/svg" width="892" height="712" viewBox="484 14 892 712"
     preserveAspectRatio="xMidYMid meet" role="presentation" aria-hidden="true" focusable="false">
  <!-- viewBox tightened to the drawing itself. As supplied it was 1600x900
     with the content sitting at x 484..1376: 30% of the canvas was empty on
     the left, and object-fit: contain scales the canvas, not the drawing, so
     the picture arrived at 29% of the hero instead of the 50-60% the TZ asks
     for. Same paths, same coordinates, smaller box. -->
  <defs>
    <style>
      .p{fill:none;stroke:#39a9ff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .s{fill:none;stroke:#39a9ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .d{fill:none;stroke:#39a9ff;stroke-width:1;stroke-dasharray:8 8;opacity:.45}
    </style>
  </defs>

  <!-- Main process pipe -->
  <path class="p" d="M1160 30V190H1030V310H850V440H720V620H510"/>
  <path class="s" d="M1175 30V205H1045V325H865V455H735V635H510"/>
  <path class="s" d="M1145 30V175H1015V295H835V425H705V605H510"/>

  <!-- Large valve / flange -->
  <circle class="p" cx="1030" cy="310" r="62"/>
  <circle class="s" cx="1030" cy="310" r="42"/>
  <path class="p" d="M1030 248V372M968 310H1092"/>
  <path class="s" d="M1000 280L1060 340M1060 280L1000 340"/>
  <path class="s" d="M990 230H1070M990 390H1070"/>

  <!-- Vertical valve -->
  <path class="p" d="M1160 190H1280V270H1160Z"/>
  <circle class="s" cx="1220" cy="230" r="32"/>
  <path class="s" d="M1188 230H1252M1220 198V262"/>
  <path class="p" d="M1195 190V125H1245V190"/>
  <path class="s" d="M1205 125L1220 95L1235 125"/>

  <!-- Pump / equipment body -->
  <path class="p" d="M850 440H1030C1080 440 1110 470 1110 520V600H850Z"/>
  <circle class="p" cx="960" cy="520" r="72"/>
  <circle class="s" cx="960" cy="520" r="48"/>
  <path class="s" d="M960 472V568M912 520H1008"/>
  <path class="s" d="M850 470H790V570H850M1110 480H1180V560H1110"/>

  <!-- Branch -->
  <path class="p" d="M850 440V350H690V280"/>
  <path class="s" d="M865 440V335H705V280"/>
  <path class="s" d="M835 440V365H675V280"/>
  <circle class="s" cx="690" cy="280" r="38"/>
  <path class="s" d="M652 280H728M690 242V318"/>

  <!-- Flanges -->
  <path class="s" d="M490 585H530M490 645H530M500 575V655M520 575V655"/>
  <path class="s" d="M1138 20H1182M1138 40H1182"/>
  <path class="s" d="M1280 260H1320M1280 280H1320M1290 250V290M1310 250V290"/>

  <!-- Dimension / engineering marks -->
  <path class="d" d="M500 700H1320M500 680V720M1320 680V720"/>
  <path class="d" d="M1350 100V650M1330 100H1370M1330 650H1370"/>
</svg>
