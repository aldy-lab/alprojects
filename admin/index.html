<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Редактор — ALPROJECTS</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
/* The site's tokens, the ones a tool needs. Not an import of style.css: that
   file is 8600 lines of a public site and this is a desk. Same ground, same
   faces, same cool greys, so it does not feel like a different product. */
:root{
  --bg:#07070b; --panel:#0c0d14; --panel-2:#101119; --line:#1e2029;
  --line-strong:#2b2e3a; --text:#e8e9ee; --muted:#9a9db0; --muted-2:#6e7183;
  --accent:#8fa6c8;            /* cool pale grey-blue, never warm */
  --ok:#7ea893; --warn:#c8a16a; --bad:#c87f7f;
  --font:"Poppins","Segoe UI",system-ui,sans-serif;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --rail:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;overflow-x:clip}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 var(--font);
     -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
/* 16px minimum: anything smaller makes iOS Safari zoom the page on focus. */
input,textarea,select{font-size:16px}
a{color:var(--accent)}

.lbl{font:500 10px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;
     color:var(--muted-2)}
.btn{border:1px solid var(--line-strong);background:transparent;color:var(--text);
     padding:9px 16px;min-height:40px;cursor:pointer;letter-spacing:.08em;
     font:500 11px/1 var(--display);text-transform:uppercase;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.btn-go{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-go:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn-s{padding:5px 10px;min-height:32px;font-size:10px}
@media (hover:none){.btn:hover{border-color:var(--line-strong);color:var(--text)}}

/* ---------- the gate ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
#gate form{width:min(380px,100%);border:1px solid var(--line);background:var(--panel);
           padding:34px}
#gate h1{font:300 23px/1.2 var(--display);letter-spacing:.02em;margin-bottom:6px}
#gate p{color:var(--muted);font-size:13px;margin-bottom:24px}
#gate input{width:100%;background:var(--panel-2);border:1px solid var(--line-strong);
            padding:13px 14px;min-height:48px;margin-bottom:14px}
#gate input:focus{outline:none;border-color:var(--accent)}
#gate .btn{width:100%}
.msg{margin-top:16px;font-size:13px;color:var(--bad);min-height:20px}
.msg.ok{color:var(--ok)}

/* ---------- the desk ---------- */
#app{display:none;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
#app.on{display:grid}
#rail{border-right:1px solid var(--line);background:var(--panel);padding:22px 0;
      position:sticky;top:0;height:100dvh;overflow:auto}
#rail h2{padding:0 20px 10px;margin-top:20px}
#rail h2:first-child{margin-top:0}
#rail button{display:block;width:100%;text-align:left;background:none;border:0;
             border-left:2px solid transparent;padding:9px 20px;min-height:40px;
             color:var(--muted);cursor:pointer;font-size:14px}
#rail button:hover{color:var(--text)}
#rail button.on{color:var(--text);border-left-color:var(--accent);background:var(--panel-2)}
#rail .foot{margin-top:28px;padding:18px 20px 0;border-top:1px solid var(--line)}

#main{padding:30px clamp(20px,3vw,44px) 90px;min-width:0}
.head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
      border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}
.head h1{font:300 25px/1.2 var(--display);letter-spacing:.02em}
.head .sp{flex:1}

.cols{display:grid;grid-template-columns:272px minmax(0,1fr);gap:28px;align-items:start}
/* The list is short and the form is long, which left a tall empty column down
   the left. Sticky turns that space into something: the list stays in reach
   while a record is scrolled through, so switching between two vacancies does
   not mean scrolling back up first. */
.cols>.recs{position:sticky;top:26px}
@media (max-width:900px){#app{grid-template-columns:1fr}#rail{position:static;height:auto}
  .cols{grid-template-columns:1fr}}

/* the record list */
.recs{border:1px solid var(--line);background:var(--panel)}
.rec{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);
     padding:8px 10px}
.rec:last-child{border-bottom:0}
.rec .nm{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--muted);
         cursor:pointer;font-size:13px;padding:6px 2px;min-height:34px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec.on .nm{color:var(--text)}
.rec .mv{background:none;border:1px solid transparent;color:var(--muted-2);cursor:pointer;
         width:26px;height:26px;line-height:1;font-size:12px}
.rec .mv:hover{color:var(--accent);border-color:var(--line-strong)}
.recs .add{width:100%;border:0;border-top:1px solid var(--line-strong);background:none;
           color:var(--accent);cursor:pointer;padding:12px;min-height:44px;
           font:500 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}

/* the fields */
.fields{border:1px solid var(--line);background:var(--panel);padding:clamp(18px,2.4vw,30px)}
.f{margin-bottom:20px}
.f>label{display:block;margin-bottom:7px}
.f input[type=text],.f input[type=date],.f textarea,.f select{
  width:100%;background:var(--panel-2);border:1px solid var(--line-strong);
  padding:10px 12px;min-height:44px}
.f textarea{min-height:96px;resize:vertical;line-height:1.55}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--accent)}
.f .hint{font-size:12px;color:var(--muted-2);margin-top:5px}
.f.struct>label{color:var(--muted-2)}
.list-item{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px}
.list-item textarea{flex:1}
.group{border-left:1px solid var(--line-strong);padding-left:16px;margin:16px 0 22px}
.group>.lbl{margin-bottom:12px;display:block}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
/* accent-color, or the browser paints its own blue -- a saturated one, and on
   this ground it becomes the brightest thing on the page. */
.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* translations */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
             padding:10px 15px;min-height:44px;cursor:pointer;
             font:500 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tr{border-bottom:1px solid var(--line);padding:16px 0}
.tr:last-child{border-bottom:0}
.tr .en{color:var(--muted);font-size:13px;margin:6px 0 9px;white-space:pre-wrap}
.tag{font:500 9px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;
     padding:4px 7px;border:1px solid currentColor;margin-left:9px;vertical-align:2px}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}

/* the save bar: it has to be reachable without finding the bottom of a long form */
#bar{position:fixed;left:var(--rail);right:0;bottom:0;background:var(--panel-2);
     border-top:1px solid var(--line-strong);padding:12px clamp(20px,3vw,44px);
     display:flex;align-items:center;gap:16px;z-index:5}
@media (max-width:900px){#bar{left:0}}
#bar .state{flex:1;font-size:13px;color:var(--muted)}
#bar .state.dirty{color:var(--warn)}
#bar .state.bad{color:var(--bad)}
#bar .state.ok{color:var(--ok)}

/* ---------- touch, LAST ----------
   A finger, not a mouse: 44px is the smallest target a thumb hits reliably,
   and the reorder and delete controls sit next to each other, so a miss
   deletes the record above the one that was meant.

   This block is at the end of the stylesheet and has to stay there. The first
   version sat next to the other media query, above the rules it overrides --
   same specificity, earlier in the file, so every declaration in it was inert
   while the diff looked exactly right. The measurement is what caught it: the
   buttons were still 26px. */
@media (hover:none),(max-width:600px){
  .rec{padding:4px 8px;gap:4px}
  .rec .mv{width:44px;height:44px;font-size:15px}
  .rec .nm{min-height:44px}
  .btn,.btn-s,#rail button{min-height:44px}
  .btn-s{padding:11px 14px}
  .chk input{width:24px;height:24px}
}
</style>
</head>
<body>

<div id="gate">
  <form id="login">
    <h1>Редактор</h1>
    <p>Содержимое сайта alprojects.eu</p>
    <label class="lbl" for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-go" type="submit">Войти</button>
    <div class="msg" id="gate-msg"></div>
  </form>
</div>

<div id="app">
  <nav id="rail">
    <h2 class="lbl">Ваше</h2>
    <div id="rail-mine"></div>
    <h2 class="lbl">Остальное</h2>
    <div id="rail-rest"></div>
    <div class="foot"><button class="btn btn-s" id="out">Выйти</button></div>
  </nav>
  <main id="main"></main>
</div>

<div id="bar" style="display:none">
  <span class="state" id="state"></span>
  <button class="btn btn-s" id="revert">Отменить</button>
  <button class="btn btn-go btn-s" id="save">Сохранить</button>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
