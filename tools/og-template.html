<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root{--black:#05060f;--white:#fff;--gray-50:#b9c4d8;--gray-150:#5f5e70;
        --blue:#12294b;--line:rgba(255,255,255,.10);--grid:rgba(142,151,171,.10)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--black);color:var(--white);
       font-family:"Montserrat",system-ui,sans-serif;overflow:hidden;position:relative}
  .bg{position:absolute;inset:0;
      background:radial-gradient(900px 560px at 8% 0%,rgba(18,41,75,.85),transparent 62%),
                 radial-gradient(700px 500px at 100% 100%,rgba(18,41,75,.55),transparent 60%)}
  .grid{position:absolute;inset:0;
        background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                         linear-gradient(90deg,var(--grid) 1px,transparent 1px);
        background-size:110px 110px;
        -webkit-mask-image:linear-gradient(to bottom,#000,rgba(0,0,0,.25))}
  .x{position:absolute;width:16px;height:16px;opacity:.4}
  .x::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--gray-150)}
  .x::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:var(--gray-150)}
  .wrap{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{height:34px;width:auto;align-self:flex-start}  /* flex would stretch it */
  .rule{width:44px;height:2px;background:var(--white);margin-bottom:18px}
  .eyebrow{font-size:17px;letter-spacing:.20em;text-transform:uppercase;color:var(--gray-50)}
  h1{margin-top:20px;font-size:60px;line-height:1.1;font-weight:600;letter-spacing:.005em;max-width:20ch}
  h1.long{font-size:46px;max-width:24ch}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;
        font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-150)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<span class="x" style="top:96px;right:150px"></span>
<span class="x" style="bottom:150px;left:110px"></span>
<span class="x" style="top:300px;right:60px"></span>
<div class="wrap">
  <img class="logo" src="../assets/logo.png" alt="">
  <div>
    <div class="rule"></div>
    <p class="eyebrow" id="eyebrow">Services</p>
    <h1 id="title">Title</h1>
  </div>
  <div class="foot"><span>alprojects.co</span><span id="tag">Industry &amp; Offshore</span></div>
</div>
</body></html>
